<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEATZY Admin</title>
<style>
:root{--bg:#f7f4ee;--ink:#171614;--gold:#d8aa50;--line:#e7e0d4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}header{background:#171614;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900}.logo span{color:var(--gold)}main{max-width:1100px;margin:28px auto;padding:0 16px}.panel,.order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}input,select,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px}input{display:block;width:100%;margin:6px 0 12px}button{background:var(--gold);border:0;font-weight:bold;cursor:pointer}.hidden{display:none!important}.muted{color:#706b62}.form{max-width:420px;margin:45px auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fbf8f1;padding:14px;border-radius:10px}.stat strong{display:block;font-size:24px}.orderhead,.statusrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.statusrow{justify-content:flex-start;margin-top:12px}.message{white-space:pre-wrap;margin-top:10px}@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">MEATZY <span>ADMIN</span></div><button id="logout" class="hidden">Log out</button></header>
<main><section id="login" class="panel form"><h1>Admin Login</h1><p class="muted">Sign in with your MEATZY admin account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div id="loginMsg" class="message"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><h1>Orders Dashboard</h1><p class="muted">Live orders from Firestore.</p><div class="stats"><div class="stat">Total orders<strong id="total">0</strong></div><div class="stat">Active<strong id="active">0</strong></div><div class="stat">Delivered<strong id="delivered">0</strong></div></div></div><div class="panel"><h2>Customer Orders</h2><div id="orders">Loading orders…</div><div id="msg" class="message"></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCGw4N7bk3-c45lK9S9XnfsIV_T0z-6Das",authDomain:"meatzy-1d3c6.firebaseapp.com",projectId:"meatzy-1d3c6",storageBucket:"meatzy-1d3c6.firebasestorage.app",messagingSenderId:"880492865945",appId:"1:880492865945:web:8190153cdaf2c1848ccb08",measurementId:"G-S85L7FZ4D7"};
const ADMIN_EMAIL="lokeshkadgekar1705@gmail.com";firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();const $=id=>document.getElementById(id);let stop=null;
function formatItem(i){const weight=Number(i.quantity||0);const unit=i.unit||i.weightUnit||"g";const total=i.lineTotal??i.total??Number(i.price||0);return `${esc(i.productName||i.name)} — ${esc(weight)} ${esc(unit)} — ₹${esc(total)}`;}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="Signing in…";try{const c=await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);if((c.user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await auth.signOut();throw Error("This is not the authorized admin account.");}if(!c.user.emailVerified){await c.user.sendEmailVerification();await auth.signOut();throw Error("Verify your admin email using the link sent to your inbox, then sign in again.");}$("loginMsg").textContent="";}catch(x){$("loginMsg").textContent=x.message;}});
$("logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{if(stop){stop();stop=null;}const ok=u&&(u.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()&&u.emailVerified;$("login").classList.toggle("hidden",!!ok);$("dashboard").classList.toggle("hidden",!ok);$("logout").classList.toggle("hidden",!ok);if(ok)loadOrders();});
const statuses=["PLACED","CONFIRMED","PREPARING","OUT FOR DELIVERY","DELIVERED","CANCELLED"];
function loadOrders(){stop=db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>{const os=s.docs.map(d=>({id:d.id,...d.data()}));$("total").textContent=os.length;$("active").textContent=os.filter(o=>!["DELIVERED","CANCELLED"].includes(o.status)).length;$("delivered").textContent=os.filter(o=>o.status==="DELIVERED").length;if(!os.length){$("orders").innerHTML="<p>No orders yet.</p>";return;}$("orders").innerHTML=os.map(o=>{const c=o.customer||{},items=(o.items||[]).map(i=>formatItem(i)).join("<br>"),date=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("en-IN"):"Time pending",opts=statuses.map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("");return `<article class="order"><div class="orderhead"><h3>${esc(o.orderNumber||o.id)}</h3><b>₹${esc(o.total||0)}</b></div><p><b>Customer:</b> ${esc(c.name||"—")}<br><b>Phone:</b> ${esc(c.phone||"—")}<br><b>Address:</b> ${esc(c.address||"—")}<br><span class="muted">${esc(date)}</span></p><p>${items||"No items"}<br>Subtotal ₹${esc(o.subtotal||0)} · Delivery ₹${esc(o.deliveryCharge||0)} · Payment ${esc(o.paymentStatus||"PENDING")}</p><div class="statusrow"><select id="st-${esc(o.id)}">${opts}</select><button onclick="updateStatus('${esc(o.id)}')">Save status</button></div></article>`;}).join("");$("msg").textContent="";},e=>{$("orders").textContent="Unable to load orders. Check Firestore Rules and email verification."; $("msg").textContent=e.message;});}
async function updateStatus(id){try{const status=$("st-"+id).value;await db.collection("orders").doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email});$("msg").textContent="Order status updated.";}catch(e){$("msg").textContent="Update failed: "+e.message;}}
</script></body></html>
